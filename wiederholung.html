<style>
:root{--bg:#fbfaf6;--fg:#161a22;--mut:#9aa0ad;--line:#d9d7cf;--c1:#2563eb;--c2:#f08a00;--c3:#12a150;--btn:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--fg:#f0f2f6;--mut:#7d8596;--line:#343b48;--c1:#5b9bff;--c2:#ffad33;--c3:#3ddc84;--btn:#1f242d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;padding:12px 16px calc(12px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}

#txt{font-size:clamp(18px,2.6vw,32px);min-height:1.4em;text-align:center}

#menu{font:inherit;font-size:clamp(16px,2vw,24px);color:inherit;background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:12px 18px;text-decoration:none}

/* Handy hochkant: Zusatzknöpfe in eine eigene Zeile, Zurück nur als Pfeil. Was trotzdem nicht passt, bricht um, statt aus dem Bild zu rutschen. */

svg .c2{fill:var(--c2);opacity:.62}

svg .tx{fill:var(--fg);font:700 30px system-ui,sans-serif}
svg .ts{fill:var(--mut);font:600 24px system-ui,sans-serif}

svg .tc1{fill:var(--c1)}

svg .hd{fill:var(--c1);opacity:.28}
svg .ip{fill:var(--c2)}

svg .wall{fill:var(--mut);opacity:.35}
svg .bk1{fill:var(--c1)}
svg .bk2{fill:var(--c2)}

svg .geo{fill:var(--c1);opacity:.07;stroke:none}
svg .geoL{stroke:var(--c1);stroke-width:2;fill:none;opacity:.7}

svg .tk{fill:var(--c1);font:600 15px system-ui,sans-serif;opacity:.85}
svg .tki{fill:var(--mut);font:600 13px system-ui,sans-serif}
svg .tkb{fill:var(--c1);font:800 24px system-ui,sans-serif}
svg .tkr{fill:#d81e1e;font:800 24px system-ui,sans-serif}

svg .tn{fill:var(--fg);font:600 20px system-ui,sans-serif}
svg .arc{stroke:var(--c1);stroke-width:4;fill:none}
svg .g1{stroke:var(--c1);stroke-width:6;stroke-linecap:round;fill:none}
svg .g2{stroke:var(--c2);stroke-width:6;stroke-linecap:round;fill:none}
svg .g3{stroke:var(--c3);stroke-width:6;stroke-linecap:round;fill:none}

svg .scr{fill:var(--c1);opacity:.12}

<body>
<h1 id="title"></h1>
<svg id="fig" viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="txt"></div>
<div id="eq"></div>
<footer>
  <a id="menu" href="./">Menü</a><button id="fs" aria-label="Vollbild" title="Vollbild (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fi" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="fo" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg></button><button id="prev" aria-label="Zurück">‹<span class="lbl"> Zurück</span></button><span id="cnt"></span>
  <div id="extras"></div>
  <button id="next">Weiter ›</button>
</footer>
<script>
'use strict';
const $ = id => document.getElementById(id);
const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const P = (x, y) => ({ x, y });
const M = P(400, 260);
// Winkel mathematisch: gegen den Uhrzeigersinn, 0° zeigt nach rechts.
const pol = (r, w, c = M) => P(c.x + r * Math.cos(rad(w)), c.y - r * Math.sin(rad(w)));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const dirOf = (c, p) => (deg(Math.atan2(-(p.y - c.y), p.x - c.x)) + 360) % 360;
const f = n => n.toFixed(1);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rnd(0, a.length - 1)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lines = (arr, n = arr.length) => arr.slice(0, n).map((l, i) => `<div class="${i < n - 1 ? 'dim' : ''}">${l}</div>`).join('');
const text = (p, s, c = 'tx') => `<text class="${c}" x="${f(p.x)}" y="${f(p.y)}" text-anchor="middle" dominant-baseline="central">${s}</text>`;
const seg = (p, q, c = 'ln') => `<line class="${c}" x1="${f(p.x)}" y1="${f(p.y)}" x2="${f(q.x)}" y2="${f(q.y)}"/>`;
const dot = (p, r = 8, c = 'pt') => `<circle class="${c}" cx="${f(p.x)}" cy="${f(p.y)}" r="${r}"/>`;
const circ = (m, r, c = 'thin') => `<circle class="${c}" cx="${f(m.x)}" cy="${f(m.y)}" r="${f(r)}"/>`;
const handle = p => `<circle class="hd" cx="${f(p.x)}" cy="${f(p.y)}" r="22"/>` + dot(p, 8);
const poly = (ps, c = 'ln') => `<polygon class="${c}" points="${ps.map(p => f(p.x) + ',' + f(p.y)).join(' ')}"/>`;
// Gerade durch p mit Richtung w, über das Bild hinaus verlängert.
const xline = (p, w, c = 'ln') => seg(pol(900, w, p), pol(900, w + 180, p), c);
// Winkelfläche gegen den Uhrzeigersinn von a1 nach a2, Beschriftung außerhalb des Bogens.
function wedge(c, a1, a2, r, cls, label, tcls = 'tx', cap = 250) {
  let d = ((a2 - a1) % 360 + 360) % 360; if (d === 0 && a2 !== a1) d = 360; if (d <= 0) return '';
  const p1 = pol(r, a1, c), p2 = pol(r, a1 + d, c);
  let s = d >= 360 ? `<circle class="wd ${cls}" cx="${f(c.x)}" cy="${f(c.y)}" r="${r}"/>`
    : `<path class="wd ${cls}" d="M${f(c.x)} ${f(c.y)}L${f(p1.x)} ${f(p1.y)}A${r} ${r} 0 ${d > 180 ? 1 : 0} 0 ${f(p2.x)} ${f(p2.y)}Z"/>`;
  if (label) {
    const half = String(label).length * 8.5 + 8;
    const lr = Math.min(cap, Math.max(r + 40, half / Math.tan(rad(Math.min(d, 178) / 2))));
    s += text(pol(lr, a1 + d / 2, c), label, tcls);
  }
  return s;
}
// Innenwinkel an Ecke v zwischen den Strahlen zu p und q (kleinerer Winkel).
function inner(v, p, q, r, cls, label, tcls, cap) {
  let a1 = dirOf(v, p), a2 = dirOf(v, q);
  if (((a2 - a1) % 360 + 360) % 360 > 180) [a1, a2] = [a2, a1];
  return wedge(v, a1, a2, r, cls, label, tcls, cap);
}
const angleAt = (v, p, q) => { const d = Math.abs(dirOf(v, p) - dirOf(v, q)); return d > 180 ? 360 - d : d; };
const cm = px => (Math.round(px / 5) / 10).toFixed(1).replace('.', ',');
// Beschriftung eines Innenwinkels außen an der Ecke v, damit sie auch bei spitzen Winkeln lesbar bleibt.
function outLab(v, p, q, s, cls = 'tx') {
  const a1 = dirOf(v, p), a2 = dirOf(v, q), d = ((a2 - a1) % 360 + 360) % 360;
  const w = (d <= 180 ? a1 + d / 2 : a2 + (360 - d) / 2) + 180, ux = Math.cos(rad(w)), uy = Math.sin(rad(w)), hw = 8.5 * String(s).length;
  const pt = pol(26 + hw * Math.abs(ux) + 16 * Math.abs(uy), w, v);
  return text(P(clamp(pt.x, hw + 6, 794 - hw), clamp(pt.y, 18, 502)), s, cls);
}

// ---------- Hilfen ----------
const rows = arr => arr.map(l => `<div>${l}</div>`).join('');
const ray = (v, w, len, c = 'ln') => seg(v, pol(len, w, v), c);
// Winkelbogen als Linie, gegen den Uhrzeigersinn von a1 nach a2
function arc(c, a1, a2, r, cls = 'arc') {
  const d = ((a2 - a1) % 360 + 360) % 360, p1 = pol(r, a1, c), p2 = pol(r, a1 + d, c);
  return `<path class="${cls}" d="M${f(p1.x)} ${f(p1.y)}A${r} ${r} 0 ${d > 180 ? 1 : 0} 0 ${f(p2.x)} ${f(p2.y)}"/>`;
}
// Zeichen für den rechten Winkel an v zwischen den Richtungen w und w + 90°
function rmark(v, w, s = 24, c = 'thin') {
  const a = pol(s, w, v), b = pol(s, w + 90, v), m = P(a.x + b.x - v.x, a.y + b.y - v.y);
  return `<path class="${c}" d="M${f(a.x)} ${f(a.y)}L${f(m.x)} ${f(m.y)}L${f(b.x)} ${f(b.y)}"/>`;
}
// Balken von p nach q mit Dicke th, nach der Seite side (+1 links, −1 rechts der Richtung)
function bar(p, q, th, cls, side = 0) {
  const l = dist(p, q), nx = -(q.y - p.y) / l, ny = (q.x - p.x) / l;
  const o1 = side ? 0 : -th / 2, o2 = side ? -side * th : th / 2;
  const sh = (pt, o) => P(pt.x + nx * o, pt.y + ny * o);
  return poly([sh(p, o1), sh(q, o1), sh(q, o2), sh(p, o2)], cls);
}
// Geodreieck als Halbkreis: Mittelpunkt c, 0-Linie in Richtung base. Außen zählt die Skala ab base, innen von der Gegenseite.
// o.at: Richtung (0 bis 180 ab base), an der beide Zahlen hervorgehoben werden. o.good: 'out' oder 'in' ist richtig.
function geo(c, base, r, o = {}) {
  const a = pol(r, base, c), b = pol(r, base + 180, c);
  let s = `<path class="geo" d="M${f(a.x)} ${f(a.y)}A${r} ${r} 0 0 0 ${f(b.x)} ${f(b.y)}Z"/>` + arc(c, base, base + 180, r, 'geoL') + seg(a, b, 'geoL');
  const every = r >= 200 ? 10 : 30;
  for (let k = 0; k <= 180; k += 5) {
    const w = base + k;
    s += seg(pol(r, w, c), pol(r - (k % 10 ? 8 : 15), w, c), 'tick');
    if (k % every === 0 && o.at !== k) s += text(pol(r - 30, w, c), k, 'tk') + text(pol(r - 54, w, c), 180 - k, 'tki');
  }
  s += seg(pol(26, base + 90, c), c, 'geoL') + circ(c, 5, 'geoL');
  if (o.at !== undefined) {
    const w = base + o.at;
    s += text(pol(r - 30, w, c), o.at, o.good === 'in' ? 'tkr' : o.good ? 'tkb' : 'tm') + text(pol(r - 58, w, c), 180 - o.at, o.good === 'in' ? 'tkb' : o.good ? 'tkr' : 'tm');
  }
  return s;
}
// ---------- Regal: parallel und senkrecht ----------
let dy = 30;
const RL = P(250, 280);
function shelfFig() {
  const R = P(550, 280 + dy), t = deg(Math.atan2(dy, 300)), ang = Math.round(90 + t);
  let s = `<rect class="wall" x="232" y="60" width="18" height="410"/><rect class="wall" x="550" y="60" width="18" height="410"/>`;
  s += bar(P(250, 110), P(550, 110), 14, 'wood') + bar(P(250, 450), P(550, 450), 14, 'wood') + bar(RL, R, 14, 'wood');
  // Bücher stehen auf dem mittleren Boden und rutschen zum tieferen Ende, wenn er schief ist.
  const fr = dy > 0 ? [0.72, 0.8, 0.88] : dy < 0 ? [0.06, 0.14, 0.22] : [0.3, 0.38, 0.46];
  fr.forEach((u, i) => {
    const b = P(RL.x + u * (R.x - RL.x) + 11, RL.y + u * (R.y - RL.y) - 7);
    s += `<rect class="bk${i + 1}" x="${f(b.x - 11)}" y="${f(b.y - 72)}" width="22" height="72" rx="3" transform="rotate(${f(t)} ${f(b.x)} ${f(b.y)})"/>`;
  });
  s += rmark(P(250, 117), 270, 22) + rmark(P(250, 443), 0, 22);
  s += dy === 0 ? rmark(P(250, 273), 0, 22) : wedge(P(250, 273), -t, 90, 46, 'c2', ang + '°', 'tx', 120);
  s += text(P(660, 110), 'Boden 1', 'tn') + text(P(670, 280 + dy), 'Boden 2', 'tn') + text(P(660, 450), 'Boden 3', 'tn') + text(P(130, 300), 'Seitenwand', 'tn');
  return s;
}
const shelfDrag = (w, p) => { const v = clamp(Math.round(p.y - 280), -70, 70); dy = Math.abs(v) < 8 ? 0 : v; };

// ---------- Geraden erkennen ----------
const GL = [
  { n: 'a', c: P(235, 160), w: 330, h: 175 }, { n: 'd', c: P(470, 240), w: 330, h: 175 },
  { n: 'e', c: P(600, 310), w: 60, h: 150 }, { n: 'b', c: P(130, 360), w: 90, h: 120 }, { n: 'c', c: P(400, 450), w: 0, h: 330 }];
function linesFig(show) {
  const col = { a: 'g1', d: 'g1', b: 'g2', c: 'g2', e: 'g3' };
  let s = '';
  GL.forEach(g => { s += seg(pol(g.h, g.w + 180, g.c), pol(g.h, g.w, g.c), show ? col[g.n] : 'ln'); });
  GL.forEach(g => { const e = pol(g.h + 26, g.w, g.c); s += text(e, g.n, 'tx'); });
  if (show) {
    // e ⊥ d am Schnittpunkt, b ⊥ c am Schnittpunkt
    const d = GL[1], e = GL[2], u = P(Math.cos(rad(330)), -Math.sin(rad(330))), v = P(Math.cos(rad(60)), -Math.sin(rad(60)));
    const det = u.x * v.y - u.y * v.x, dx = e.c.x - d.c.x, dy2 = e.c.y - d.c.y, t = (dx * v.y - dy2 * v.x) / det;
    s += rmark(P(d.c.x + t * u.x, d.c.y + t * u.y), 330, 22, 'thin') + rmark(P(130, 450), 0, 22, 'thin');
  }
  return s;
}

// ---------- Laptop: Fachbegriffe ----------
let lw = 110;
const LS = P(300, 390);
function laptopFig(show) {
  const K = pol(340, 0, LS), T = pol(280, lw, LS);
  let s = bar(LS, K, 22, 'lap', -1) + bar(LS, T, 18, 'lap', 1) + bar(pol(14, lw, LS), pol(266, lw, LS), 12, 'scr', -1);
  s += wedge(LS, 0, lw, 70, 'c1') + seg(LS, K) + seg(LS, T);
  if (!show) return s + text(pol(42, lw / 2, LS), 'α', 'tx');
  s += arc(LS, 0, lw, 70) + dot(LS, 9) + text(pol(42, lw / 2, LS), 'α', 'tx');
  s += text(P(LS.x - 10, LS.y + 52), 'Scheitelpunkt S', 'tm');
  s += text(P(LS.x + 250, LS.y + 52), 'Schenkel', 'tm') + text(pol(80, lw + 90, pol(190, lw, LS)), 'Schenkel', 'tm');
  s += text(pol(118, lw / 2, LS), 'Winkelbogen', 'tm');
  return s;
}
const laptopDrag = w => { lw = clamp(Math.round(w), 40, 170); };

// ---------- Winkelarten ----------
const KINDS = [[50, '0° < α < 90°', 'spitz'], [90, 'α = 90°', 'rechter Winkel'], [130, '90° < α < 180°', 'stumpf'], [250, '180° < α < 360°', 'überstumpf']];
function kindsFig(show) {
  let s = '';
  KINDS.forEach(([a, r, n], i) => {
    const cx = 100 + i * 200, V = P(cx - (a > 180 ? 30 : a > 90 ? 20 : 50), 260);
    s += (a === 90 ? rmark(V, 0, 34) : wedge(V, 0, a, 52, 'c1')) + ray(V, 0, 110) + ray(V, a, a > 180 ? 100 : 110) + dot(V, 7);
    s += text(P(cx, 430), r, 'tn');
    if (show) s += text(P(cx, 100), n, 'tm');
  });
  return s;
}

// ---------- Winkel messen ----------
// Erster Schenkel zeigt nach links, damit man die innere Skala braucht. Der zweite Schenkel ist zu kurz und wird verlängert.
const MA = 50, MV = P(400, 420), MW = 180 - MA;
function measureFig(show) {
  return geo(MV, 0, 250, show ? { at: MW, good: 'in' } : { at: MW }) + wedge(MV, MW, 180, 56, 'c1')
    + ray(MV, 180, 300) + ray(MV, MW, 120) + seg(pol(120, MW, MV), pol(285, MW, MV), 'da') + dot(MV, 7);
}

// ---------- Winkel zeichnen ----------
const zw = 130;
let zs = 1;
const ZV = P(400, 430);
function drawFig() {
  let s = ray(ZV, 0, 330) + dot(ZV, 7) + text(P(ZV.x - 4, ZV.y + 30), 'S', 'tx');
  if (zs === 2 || zs === 3) s += geo(ZV, 0, 250, zs === 3 ? { at: zw, good: 'out' } : {});
  if (zs === 3) s += dot(pol(262, zw, ZV), 8, 'mk');
  if (zs >= 4) s += ray(ZV, zw, 330) + dot(pol(262, zw, ZV), 6, 'mk');
  if (zs === 5) s += wedge(ZV, 0, zw, 60, 'c1', `α = ${zw}°`, 'tx', 160) + arc(ZV, 0, zw, 60);
  return s;
}
const ZT = ['', 'Zeichne einen Schenkel und markiere den Scheitelpunkt S.',
  'Leg das Geodreieck an: Nullpunkt auf S, 0-Linie auf den Schenkel.',
  'Markiere einen Punkt bei der Zahl. Lies auf der Skala, die am Schenkel bei 0° beginnt.',
  'Nimm das Geodreieck weg und verbinde S mit dem Punkt.',
  'Zeichne den Winkelbogen und beschrifte den Winkel.'];

// ---------- Folien ----------
const STEPS = [
  { t: 'Ein Regal', enter: () => { dy = 30; }, drag: shelfDrag, fig: shelfFig,
    txt: () => dy === 0 ? 'Jetzt stimmt es: Die Böden sind parallel, und jeder Boden steht senkrecht auf der Seitenwand.' : 'Der mittlere Boden sitzt schief, die Bücher rutschen. Zieh ihn, bis er gerade ist.',
    eq: () => dy === 0 ? 'Boden 1 ∥ Boden 2 &nbsp;&nbsp; Boden 2 ⊥ Seitenwand' : `Winkel an der Wand: ${Math.round(90 + deg(Math.atan2(dy, 300)))}° ≠ 90°` },
  { t: 'Parallel oder senkrecht?', rv: 1, fig: () => linesFig(shown),
    txt: () => shown ? 'Parallel: überall gleicher Abstand, kein Schnittpunkt. Senkrecht: Sie bilden einen rechten Winkel.' : 'Welche Geraden sind zueinander parallel, welche senkrecht?',
    eq: () => shown ? 'a ∥ d &nbsp;&nbsp; b ⊥ c &nbsp;&nbsp; e ⊥ a &nbsp;&nbsp; e ⊥ d' : '' },
  { t: 'Teile eines Winkels', rv: 1, c: LS, enter: () => { lw = 110; }, drag: laptopDrag, fig: () => laptopFig(shown),
    txt: () => shown ? 'Jeder Winkel hat einen Scheitelpunkt, zwei Schenkel und einen Winkelbogen.' : 'Klappst du einen Laptop auf, entsteht ein Winkel α. Wie heißen seine Teile?',
    eq: () => shown ? `α = ${lw}°` : '' },
  { t: 'Winkelarten', rv: 1, fig: () => kindsFig(shown), txt: () => shown ? 'Genau 90° ist ein rechter Winkel. Die Grenzen sind 90° und 180°.' : 'Wie heißen diese Winkelarten?' },
  { t: 'Winkel messen', rv: 1, fig: () => measureFig(shown),
    txt: () => shown ? 'Lies auf der Skala ab, die an deinem ersten Schenkel bei 0° beginnt.' : 'Nullpunkt auf den Scheitelpunkt, 0-Linie auf einen Schenkel, kurzen Schenkel verlängern. Welche Zahl stimmt?',
    eq: () => shown ? `α = ${MA}°, denn der Winkel ist spitz.` : '' },
  { t: 'Winkel zeichnen', enter: () => { zs = 1; }, fig: drawFig, txt: () => `Schritt ${zs}: ${ZT[zs]}`, eq: () => `α = ${zw}°`,
    btns: [{ l: 'Nächster Schritt', f: () => { zs = Math.min(5, zs + 1); }, dis: () => zs === 5 }] }
];

// ---------- Ablauf ----------
let step = 0, pair = 0, shown = false, shownStep = -1;
function render() {
  const st = STEPS[step];
  $('title').textContent = typeof st.t === 'function' ? st.t() : st.t;
  $('fig').innerHTML = st.fig();
  $('txt').textContent = typeof st.txt === 'function' ? st.txt() : st.txt || '';
  $('eq').innerHTML = st.eq ? st.eq() : '';
  if (shownStep !== step) {
    shownStep = step;
    $('extras').innerHTML = (st.btns || []).map((b, i) => `<button data-b="${i}">${b.l}</button>`).join('');
    $('cnt').textContent = `${step + 1} / ${STEPS.length}`;
    $('prev').disabled = step === 0;
  }
  $('next').disabled = step === STEPS.length - 1 && !(st.rv && !shown);
  const bs = $('extras').children || [];
  for (let i = 0; i < bs.length; i++) bs[i].disabled = !!(st.btns[i].dis && st.btns[i].dis());
}
function go(d) {
  const n = step + d; if (n < 0 || n >= STEPS.length) return;
  step = n; pair = 0; shown = false;
  if (typeof onGo === 'function') onGo();
  if (STEPS[step].enter) STEPS[step].enter();
  render();
}
$('prev').addEventListener('click', () => go(-1));
// Bei Folien mit verdecktem Ergebnis deckt der erste Druck auf, der zweite geht weiter.
const fwd = () => { const st = STEPS[step]; if (st.rv && !shown) { shown = true; render(); } else go(1); };
$('next').addEventListener('click', fwd);
$('extras').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  STEPS[step].btns[+b.dataset.b].f(); render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); fwd(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
});

const fig = $('fig'); let down = false;
// Zeigerposition in Bildkoordinaten, auch wenn das Bild mit Rand eingepasst ist.
function svgPt(e) {
  const r = fig.getBoundingClientRect(), sc = Math.min(r.width / 800, r.height / 520);
  return P((e.clientX - r.left - (r.width - 800 * sc) / 2) / sc, (e.clientY - r.top - (r.height - 520 * sc) / 2) / sc);
}
const ctr = st => typeof st.c === 'function' ? st.c() : st.c || M;
fig.addEventListener('pointerdown', e => {
  const st = STEPS[step], p = svgPt(e), w = dirOf(ctr(st), p);
  if (st.tap) { st.tap(w, p); return render(); }
  if (!st.drag) return;
  if (st.down && st.down(p) === false) return;
  down = true; try { fig.setPointerCapture(e.pointerId); } catch (x) {}
  st.drag(w, p); render(); e.preventDefault();
});
fig.addEventListener('pointermove', e => { const st = STEPS[step]; if (down && st.drag) { const p = svgPt(e); st.drag(dirOf(ctr(st), p), p); render(); } });
const up = () => { if (down) { down = false; const st = STEPS[step]; if (st.up) { st.up(); render(); } } };
fig.addEventListener('pointerup', up); fig.addEventListener('pointercancel', up);
if (typeof onGo === 'function') onGo();
if (STEPS[0].enter) STEPS[0].enter();
render();
// Vollbild: Knopf oder Taste F. Nach einem Seitenwechsel holt der erste Tipp das Vollbild zurück.
(() => {
  const d = document, el = d.documentElement, b = d.getElementById('fs');
  if (!b) return;
  // Als App vom Home-Bildschirm gibt es keine Browserleisten. Vollbild brächte dort nur das X oben links.
  const app = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if (app || !(d.fullscreenEnabled || d.webkitFullscreenEnabled)) { b.hidden = true; return; }
  const on = () => !!(d.fullscreenElement || d.webkitFullscreenElement);
  const want = v => { try { if (v === undefined) return sessionStorage.getItem('fs') === '1'; sessionStorage.setItem('fs', v ? '1' : '0'); } catch (e) { return false; } };
  const call = (o, f) => { if (!f) return; try { const p = f.call(o); if (p && p.catch) p.catch(() => {}); } catch (e) {} };
  const enter = () => call(el, el.requestFullscreen || el.webkitRequestFullscreen);
  const exit = () => call(d, d.exitFullscreen || d.webkitExitFullscreen);
  const toggle = () => { if (on()) { want(false); exit(); } else { want(true); enter(); } };
  let leaving = false;
  const sync = () => {
    const f = on(); el.classList.toggle('fs', f); if (!f) el.classList.remove('wide');
    b.setAttribute('aria-pressed', f); b.title = f ? 'Vollbild beenden (F)' : 'Vollbild (F)';
  };
  const change = () => { sync(); if (!on() && !leaving) want(false); };   // mit X oder Esc beendet
  b.addEventListener('click', toggle);
  d.addEventListener('fullscreenchange', change);
  d.addEventListener('webkitfullscreenchange', change);
  d.addEventListener('click', e => {
    const a = e.target.closest('a[href]');
    if (a) { if (!a.hasAttribute('download')) leaving = true; return; }
    if (!b.contains(e.target) && !on() && want()) enter();
  }, true);
  d.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggle(); }
    else if (e.key !== 'Escape' && !on() && want()) enter();
  });
  addEventListener('pagehide', () => { leaving = true; });
  addEventListener('pageshow', () => { leaving = false; sync(); });
  sync();
})();
// App vom Home-Bildschirm: Sie hat keine Zurück-Taste. Links führen deshalb nur zu eigenen Seiten, und die haben alle einen Weg zum Menü.
if (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches) document.addEventListener('click', e => {
  const a = e.target.closest('a[href]'); if (!a) return;
  const u = new URL(a.href);
  if (a.hasAttribute('download') || u.origin !== location.origin || !/(\/|\.html)$/.test(u.pathname)) e.preventDefault();
}, true);
// Offline: Nach dem ersten Aufruf liegen alle Stunden und Arbeitsblätter im Speicher.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
